<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Take What You Need! — Moving Out Giveaway</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 font-size=%2280%22>&#x1F3E1;</svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="banner">
    <div class="banner-icon" aria-hidden="true">🏡</div>
  </header>

  <main class="page">
    <h1 class="title">Take What You Need!</h1>

    <section class="intro">
      <h2 class="intro-heading">Moving Out Giveaway</h2>
      <p class="intro-text">
        Browse the items below and claim anything you'd like. To claim an item,
        type your name into the box under it and press <strong>Enter</strong>.
        You can only undo a claim by messaging me.
      </p>
    </section>

    <div id="status" class="status" role="status"></div>

    <div id="categories" class="categories"></div>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body">
        <div class="modal-gallery" id="modal-gallery"></div>
        <div class="modal-details">
          <h3 class="modal-title" id="modal-title"></h3>
          <div class="modal-lines" id="modal-lines"></div>
          <div class="modal-extra" id="modal-extra"></div>
          <div class="modal-claim" id="modal-claim"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
